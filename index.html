<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Tour | Dinas Tenaga Kerja Prov. Jateng</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="mobile.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Pannellum 360 Viewer -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css" />
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    
    <!-- Tailwind & Lucide (Required for Sync with Admin) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <meta name="theme-color" content="#000000">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000000 !important;
            overflow: hidden;
        }

        #panorama {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), filter 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #panorama.zoom-dash {
            transform: scale(1.2);
            filter: blur(15px) brightness(0.4);
        }

        #panorama.zoom-enter {
            transform: scale(0.95);
            filter: blur(10px);
        }

        /* Custom styles to hide pannellum controls */
        .pnlm-control-bar,
        .pnlm-panorama-info {
            display: none !important;
        }
    </style>
    <link rel="stylesheet" href="map.css">
    <script src="map.js"></script>
</head>

<body>

    <div id="app">

        <!-- 360 Viewer Container -->
        <div id="panorama"></div>

        <!-- BOTTOM-LEFT: Room Info only -->
        <footer class="info-bar">
            <div class="inst-badge">Dinas Tenaga Kerja Prov. Jateng</div>
            <h1 id="room-title"></h1>
            <p id="room-desc"></p>
            <div id="room-facilities"></div>
        </footer>

        <!-- Navigation arrows -->
        <div id="nav-arrows"></div>

        <!-- BOTTOM-RIGHT: Fully Transparent Home Button -->
        <button onclick="window.resetToHome()" class="fixed bottom-6 right-6 md:bottom-8 md:right-8 z-[50] w-12 h-12 flex items-center justify-center text-white/40 hover:text-white transition-all active:scale-90" title="Kembali ke Awal">
            <i data-lucide="home" class="w-8 h-8"></i>
        </button>

        <div id="flash"></div>
    </div>

    <script type="module" src="main.js"></script>
</body>

</html>
