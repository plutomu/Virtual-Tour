<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VT Studio Pro | Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        indigo: {
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { height: 4px; width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 0; }
    </style>
</head>
<body class="bg-slate-50 font-['Outfit'] overflow-hidden">
    

    <!-- Main Wrapper -->
    <div class="flex flex-col lg:flex-row h-screen">
        
        <!-- Workspace (Map) -->
        <main class="flex-1 relative bg-[#fcfdff] overflow-hidden order-1 lg:order-2">
            <!-- Canvas Tools Overlay (Desktop) -->
            <div class="hidden lg:flex absolute top-8 right-8 gap-2 items-center pointer-events-none z-10 transition-all">
                <div class="flex gap-1.5 pointer-events-auto items-center p-1.5 bg-white/40 backdrop-blur-md rounded-2xl border border-slate-200 shadow-xl">
                    <button onclick="window.showNewSceneForm()" title="Tambah Ruangan" class="w-9 h-9 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl flex items-center justify-center transition-all shadow-lg shadow-indigo-100 active:scale-90">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                    </button>
                    <button onclick="window.openQuickPreview()" title="Lihat Tour" class="w-9 h-9 bg-white hover:bg-slate-50 text-slate-600 border border-slate-100 rounded-xl flex items-center justify-center transition-all shadow-sm active:scale-90">
                        <i data-lucide="eye" class="w-4 h-4"></i>
                    </button>
                    <div class="w-px h-6 bg-slate-200 mx-1"></div>
                    <button onclick="window.zoomToFit()" title="Reset Zoom" class="w-9 h-9 bg-white/50 hover:bg-white text-slate-400 hover:text-indigo-600 rounded-xl flex items-center justify-center transition-all active:scale-90">
                        <i data-lucide="maximize" class="w-4 h-4"></i>
                    </button>
                    <button onclick="window.loadScenes()" title="Refresh Data" class="w-9 h-9 bg-white/50 hover:bg-white text-slate-400 hover:text-indigo-600 rounded-xl flex items-center justify-center transition-all active:scale-90">
                        <i data-lucide="rotate-cw" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <!-- Vis.js Container -->
            <div id="vis-container" class="w-full h-full"></div>
            
        </main>

        <!-- Sidebar / Bottom Dock -->
        <aside id="main-sidebar" class="w-full lg:w-80 h-48 lg:h-full bg-white border-t lg:border-t-0 lg:border-r border-slate-200 flex flex-col z-50 order-2 lg:order-1 shadow-[0_-10px_40px_rgba(0,0,0,0.05)] lg:shadow-none">
            <!-- Desktop Header -->
            <div class="hidden lg:block p-8 pb-1">
                <h2 class="text-2xl font-black text-slate-900 tracking-tight">Ruangan</h2>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest leading-loose">Global <span id="scene-count" class="text-indigo-600">0</span> Lokasi</p>
            </div>

            <!-- Search Bar (Visible on Mobile & Desktop) -->
            <div class="px-4 lg:px-8 py-2">
                <div class="relative group">
                    <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-slate-300 group-focus-within:text-indigo-600 transition-colors"></i>
                    <input type="text" id="scene-search" placeholder="Cari ruangan..." 
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl py-1.5 lg:py-2.5 pl-9 pr-4 text-[11px] lg:text-[13px] font-semibold focus:outline-none focus:ring-4 focus:ring-indigo-500/5 focus:border-indigo-500 transition-all shadow-sm"
                        oninput="window.filterScenes(this.value)">
                </div>
            </div>

            <!-- Scene List: Horizontal Scroller on Mobile, Vertical on Desktop -->
            <div id="sidebar-scene-list" class="flex-1 flex lg:flex-col items-center lg:items-stretch gap-3 p-3 lg:p-6 overflow-x-auto lg:overflow-y-auto custom-scrollbar scroll-smooth">
                <!-- Scenes will be injected here -->
            </div>

            <!-- Bottom Static Action Bar (Mobile Only) -->
            <div class="lg:hidden bg-slate-50 border-t border-slate-200 p-2 grid grid-cols-4 gap-1.5">
                <button onclick="window.showNewSceneForm()" class="flex flex-col items-center justify-center gap-0.5 p-1.5 bg-indigo-600 text-white rounded-xl active:scale-95 transition-all">
                    <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                    <span class="text-[7px] font-black uppercase tracking-tight">Tambah</span>
                </button>
                <button onclick="window.openQuickPreview()" class="flex flex-col items-center justify-center gap-0.5 p-1.5 bg-white border border-slate-200 text-slate-600 rounded-xl active:scale-95 transition-all">
                    <i data-lucide="eye" class="w-3.5 h-3.5"></i>
                    <span class="text-[7px] font-black uppercase tracking-tight">Lihat</span>
                </button>
                <button onclick="window.zoomToFit()" class="flex flex-col items-center justify-center gap-0.5 p-1.5 bg-white border border-slate-200 text-slate-400 rounded-xl active:scale-95 transition-all">
                    <i data-lucide="maximize" class="w-3.5 h-3.5"></i>
                    <span class="text-[7px] font-black uppercase tracking-tight">Fit</span>
                </button>
                <button onclick="window.loadScenes()" class="flex flex-col items-center justify-center gap-0.5 p-1.5 bg-white border border-slate-200 text-slate-400 rounded-xl active:scale-95 transition-all">
                    <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i>
                    <span class="text-[7px] font-black uppercase tracking-tight">Sync</span>
                </button>
            </div>
        </aside>

    </div>

    <!-- Modal Backdrop -->
    <div id="modal-backdrop" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[60] hidden" onclick="closeForm()"></div>

    <!-- Edit Modal (Right Side / Full Mobile) -->
    <div id="scene-form-modal" class="fixed top-0 right-0 h-full w-full lg:max-w-[380px] bg-white z-[70] translate-x-full transition-transform duration-500 ease-in-out shadow-[-20px_0_60px_rgba(0,0,0,0.1)] border-l border-slate-100 flex flex-col">
        <div class="p-6 border-b border-slate-50 flex justify-between items-center">
            <div>
                <h3 id="form-title" class="text-lg font-black text-slate-900 leading-tight">Edit Ruangan</h3>
                <p class="text-[10px] font-bold text-slate-400 mt-0.5 uppercase tracking-wider">Properties & Routes</p>
            </div>
            <button onclick="closeForm()" class="w-9 h-9 flex items-center justify-center rounded-xl bg-slate-50 text-slate-400 hover:text-rose-500 transition-all">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <div class="flex-1 overflow-y-auto p-6 space-y-6 custom-scrollbar">
            <!-- Form fields exactly as before but layout optimized -->
            <div class="space-y-4">
                <div class="space-y-1.5">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">ID Ruangan</label>
                    <input type="text" id="scene-id" class="w-full p-3.5 bg-slate-50 border border-slate-100 rounded-2xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none transition-all font-bold text-slate-700 text-sm" placeholder="ID Unik (misal: lobi)">
                </div>
                <div class="space-y-1.5">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Nama Ruangan</label>
                    <input type="text" id="scene-title" class="w-full p-3.5 bg-slate-50 border border-slate-100 rounded-2xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none transition-all font-bold text-slate-700 text-sm" placeholder="Nama Tampilan">
                </div>
                
                <div class="space-y-1.5">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Deskripsi Ruangan</label>
                    <textarea id="scene-desc" rows="3" class="w-full p-3.5 bg-slate-50 border border-slate-100 rounded-2xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none transition-all resize-none font-medium text-xs text-slate-600" placeholder="Detail singkat mengenai ruangan ini..."></textarea>
                </div>
                
                <div class="flex items-center justify-between p-4 bg-slate-50 rounded-2xl border border-slate-100">
                    <div>
                        <p class="text-xs font-bold text-slate-700">Status Aktif</p>
                        <p class="text-[9px] font-medium text-slate-400">Tampilkan di Tour Utama</p>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="scene-active" checked>
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <!-- Image Picker -->
            <div class="space-y-3">
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest text-center block">Panorama Image</label>
                <div class="relative group">
                    <input type="file" id="scene-image-file" accept="image/*" class="hidden" onchange="previewImage(this)">
                    <label for="scene-image-file" class="flex flex-col items-center justify-center aspect-[16/9] cursor-pointer border-2 border-dashed border-slate-200 rounded-[2rem] bg-slate-50 hover:bg-white hover:border-indigo-300 transition-all overflow-hidden relative group">
                        <img id="upload-preview" class="absolute inset-0 w-full h-full object-cover hidden">
                        <div id="upload-placeholder" class="flex flex-col items-center gap-2 text-slate-400">
                            <i data-lucide="image-plus" class="w-8 h-8 opacity-40"></i>
                            <span class="text-[10px] font-black uppercase tracking-tighter">Click to Upload 360</span>
                        </div>
                    </label>
                    <input type="hidden" id="scene-image-path">
                </div>
            </div>

            <!-- Components: Picker, Connection, Facilities (handled by JS) -->
            <div id="hotspot-picker-tool" class="hidden mt-4 p-4 bg-slate-900 rounded-[2rem] border border-white/5 shadow-2xl">
                <!-- picker content -->
            </div>

            <div id="connection-manager"></div>
            
            <div id="facility-container">
                <div class="mt-8 border-t border-slate-100 pt-6">
                    <div class="flex justify-between items-center mb-4">
                        <h4 class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Fasilitas Ruangan</h4>
                        <button onclick="window.addFacility()" class="text-[10px] font-bold text-indigo-600 hover:text-indigo-700 flex items-center gap-1 bg-indigo-50 px-3 py-1.5 rounded-xl transition-all">
                            <i data-lucide="plus" class="w-3 h-3"></i>
                            Tambah
                        </button>
                    </div>
                    <div id="facility-list" class="space-y-2"></div>
                </div>
            </div>
        </div>

        <!-- Footer Actions -->
        <div class="p-6 bg-slate-50 border-t border-slate-100 flex gap-3">
            <button class="w-14 h-14 bg-white border border-slate-200 text-rose-500 hover:bg-rose-50 hover:border-rose-200 rounded-2xl flex items-center justify-center transition-all active:scale-95" title="Hapus" onclick="window.deleteScene()">
                <i data-lucide="trash-2" class="w-6 h-6"></i>
            </button>
            <button class="flex-1 h-14 bg-indigo-600 text-white font-bold rounded-2xl shadow-lg shadow-indigo-100 hover:bg-indigo-700 transition-all active:scale-95 flex items-center justify-center gap-2" onclick="saveScene()">
                <i data-lucide="save" class="w-5 h-5"></i>
                Simpan
            </button>
        </div>
    </div>

    <!-- Preview Modal -->
    <div id="quick-preview-modal" class="fixed inset-0 z-[100] hidden flex flex-col bg-black">
        <div class="relative flex-1 w-full h-full">
            <div id="preview-panorama" class="w-full h-full"></div>
            
            <!-- Floating Close Button -->
            <button onclick="closeQuickPreview()" class="absolute top-6 right-6 w-12 h-12 flex items-center justify-center rounded-2xl bg-black/20 hover:bg-black/40 backdrop-blur-md text-white border border-white/10 transition-all z-10 active:scale-95 shadow-2xl">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>


            <!-- Title Overlay (Cinematic Info - Calibrated) -->
            <div class="absolute bottom-6 left-8 lg:left-12 max-w-xl pointer-events-none z-10 select-none">
                <p id="preview-org" class="text-white text-[12px] lg:text-[15px] font-extrabold uppercase tracking-[0.12em] mb-2 drop-shadow-[0_2px_10px_rgba(0,0,0,0.8)] opacity-90">DINAS TENAGA KERJA PROV. JATENG</p>
                <h1 id="preview-title" class="text-white text-3xl lg:text-[36px] font-bold mb-2 drop-shadow-[0_4px_30px_rgba(0,0,0,0.8)] leading-tight tracking-[-0.04em]">Pintu Masuk Utama</h1>
                <p id="preview-desc" class="text-white text-xs lg:text-[14px] font-medium max-w-md drop-shadow-[0_2px_15px_rgba(0,0,0,0.8)] leading-relaxed opacity-90">Akses utama menuju Ruang Layanan.</p>
                
                <!-- Facility List overlay -->
                <div id="preview-facilities" class="mt-8 flex flex-wrap gap-2 pointer-events-none">
                    <!-- Facilities will be injected here -->
                </div>
            </div>
        </div>
    </div>

    <script src="rahasia_admin.js" type="module"></script>
</body>
</html>
